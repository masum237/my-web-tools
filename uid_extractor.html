<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UID Extractor</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#172033;background:#f5f6fa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:min(760px,100%);background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:26px;box-shadow:0 16px 48px rgba(25,35,60,.08)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:19px;letter-spacing:-.35px;margin:0;font-weight:700}
.status{font-size:12px;color:#64748b;background:#f1f5f9;border-radius:20px;padding:5px 10px}
textarea{display:block;width:100%;min-height:220px;resize:vertical;border:1px solid #dce1e9;border-radius:10px;background:#fcfcfd;padding:14px 15px;color:#202b3c;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;outline:none;transition:border-color .15s,box-shadow .15s}
textarea:focus{border-color:#6479dc;box-shadow:0 0 0 3px rgba(100,121,220,.12);background:#fff}
textarea::placeholder{color:#a0a8b6}
.actions{display:flex;gap:10px;margin-top:13px}
button{height:40px;padding:0 16px;border:0;border-radius:9px;font-size:13px;font-weight:650;cursor:pointer;transition:background .15s,transform .15s}
button:active{transform:translateY(1px)}
.primary{background:#4058c9;color:white}.primary:hover{background:#344bb6}
.secondary{background:#f0f2f6;color:#354052}.secondary:hover{background:#e7eaf0}
.output-wrap{margin-top:22px;border:1px solid #e5e8ef;border-radius:11px;overflow:hidden}
.output-head{height:48px;padding:0 13px 0 15px;display:flex;align-items:center;justify-content:space-between;background:#fafbfc;border-bottom:1px solid #e9ecf2}
.output-title{font-size:13px;font-weight:650;color:#354052}
.count{margin-left:7px;color:#8a94a5;font-weight:500}
.copy{height:31px;padding:0 12px;font-size:12px}
#output{min-height:78px;max-height:260px;overflow:auto;padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace;color:#202b3c}
.empty{color:#a0a8b6}
@media(max-width:520px){body{padding:14px}.panel{padding:18px;border-radius:13px}textarea{min-height:190px}.actions button{flex:1}}
</style>
</head>
<body>
<main class="panel">
  <div class="top">
    <h1>UID Extractor</h1>
    <span class="status" id="status">Ready</span>
  </div>
  <textarea id="cookies" spellcheck="false" placeholder="Paste cookies here..."></textarea>
  <div class="actions">
    <button class="primary" id="extract">Extract UID</button>
    <button class="secondary" id="clear">Clear</button>
  </div>
  <section class="output-wrap">
    <div class="output-head">
      <div class="output-title">UIDs <span class="count" id="count">0</span></div>
      <button class="secondary copy" id="copy">Copy All</button>
    </div>
    <div id="output" class="empty">UIDs will appear here</div>
  </section>
</main>
<script>
(() => {
 const input=document.getElementById('cookies');
 const output=document.getElementById('output');
 const count=document.getElementById('count');
 const status=document.getElementById('status');
 let uids=[];
 function extract(){
   const matches=[...input.value.matchAll(/(?:^|[;|,\s])c_user\s*=\s*["']?(\d+)/g)];
   uids=[...new Set(matches.map(m=>m[1]))];
   count.textContent=uids.length;
   output.textContent=uids.length?uids.join('\n'):'No UID found';
   output.classList.toggle('empty',!uids.length);
   status.textContent=uids.length?'Completed':'No results';
 }
 document.getElementById('extract').addEventListener('click',extract);
 document.getElementById('clear').addEventListener('click',()=>{
   input.value='';uids=[];count.textContent='0';
   output.textContent='UIDs will appear here';output.classList.add('empty');
   status.textContent='Ready';input.focus();
 });
 document.getElementById('copy').addEventListener('click',async()=>{
   if(!uids.length)return;
   try{
     await navigator.clipboard.writeText(uids.join('\n'));
     const b=document.getElementById('copy');b.textContent='Copied';
     setTimeout(()=>b.textContent='Copy All',1100);
   }catch{
     status.textContent='Select to copy';
   }
 });
})();
</script>
</body>
</html>
