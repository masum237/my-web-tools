<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UID Extractor - Masum Automation</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-main: #0b0f19; --bg-surface: #121624; --bg-card: #181c2a; --bg-input: #0e111a;
            --border: #23283b; --text-main: #ffffff; --text-muted: #8b94a5;
            --accent-cyan: #00f0ff; --accent-green: #00e676; --accent-blue: #3b82f6;
            --icon-orange: #ff9800; --icon-red: #f44336; --icon-teal: #14b8a6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background-color: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 16px; flex-shrink: 0; z-index: 50; transition: left 0.3s ease; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.15rem; font-weight: 800; color: var(--text-main); text-decoration: none; margin-bottom: 24px; padding: 0 8px; }
        .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); border-radius: 8px; display: grid; place-items: center; color: #000; }
        .user-badge { background: rgba(0, 230, 118, 0.1); border: 1px solid rgba(0, 230, 118, 0.2); color: var(--accent-green); padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
        .user-badge::before { content: ''; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 8px var(--accent-green); }
        
        .nav-label { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 10px 8px; letter-spacing: 1px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--text-muted); text-decoration: none; border-radius: 8px; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; margin-bottom: 4px; }
        .nav-item:hover { background: rgba(255,255,255,0.03); color: var(--text-main); }
        .nav-item.active { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); font-weight: 600; border: 1px solid rgba(0, 240, 255, 0.2); border-left: 3px solid var(--accent-cyan); }
        .nav-icon { width: 18px; height: 18px; stroke-width: 2.5; }

        .sidebar-bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .control-box { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted); background: var(--bg-card); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); }
        
        /* Mobile Elements */
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; backdrop-filter: blur(2px); }
        .mobile-header { display: none; background: var(--bg-surface); padding: 16px 20px; border-bottom: 1px solid var(--border); align-items: center; justify-content: space-between; z-index: 20; }
        .menu-btn { background: transparent; border: none; color: var(--text-main); cursor: pointer; display: grid; place-items: center; padding: 4px; border-radius: 6px; }
        .menu-btn:hover { background: rgba(255,255,255,0.1); }

        .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; display: flex; justify-content: center; align-items: flex-start; }
        .footer { background: var(--bg-surface); border-top: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); }
        .footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }

        /* Tool Styles */
        .panel { width: min(760px, 100%); background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        h1.tool-title { font-size: 1.2rem; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .status-badge { font-size: 11px; color: var(--accent-cyan); background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 20px; padding: 5px 12px; text-transform: uppercase; font-weight: 600; }
        textarea { display: block; width: 100%; min-height: 180px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-input); padding: 14px 15px; color: var(--text-main); font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; outline: none; transition: all 0.2s; }
        textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1); }
        textarea::placeholder { color: #4b5563; }
        .actions { display: flex; gap: 10px; margin-top: 16px; }
        button { height: 42px; padding: 0 20px; border: 1px solid transparent; border-radius: 8px; font-size: 13px; font-weight: 650; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .primary { background: rgba(0, 240, 255, 0.1); color: var(--accent-cyan); border-color: rgba(0, 240, 255, 0.3); flex: 1; }
        .secondary { background: var(--bg-input); color: var(--text-muted); border-color: var(--border); }
        .output-wrap { margin-top: 24px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-input); }
        .output-head { height: 46px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border-bottom: 1px solid var(--border); }
        .output-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px;}
        .count { margin-left: 8px; color: var(--accent-green); background: rgba(0, 230, 118, 0.1); padding: 2px 8px; border-radius: 12px; font-weight: 700; }
        .copy { height: 28px; padding: 0 12px; font-size: 11px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
        #output { min-height: 78px; max-height: 200px; overflow: auto; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.8 ui-monospace, Consolas, monospace; color: var(--text-main); }
        .empty { color: #4b5563 !important; }

        /* Responsive */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar { position: fixed; left: -280px; top: 0; bottom: 0; height: 100vh; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { left: 0; }
            .sidebar-overlay.active { display: block; }
            .main-content { padding: 20px 16px; display: block; }
            .panel { padding: 16px; width: 100%; }
            .top { flex-direction: column; align-items: flex-start; gap: 12px; }
            .actions { flex-direction: column; width: 100%; }
            .actions button { width: 100%; }
            .footer { flex-direction: column; gap: 12px; text-align: center; }
            .footer-links { justify-content: center; }
            .footer-links span { width: 100%; display: block; margin: 8px 0 0 0 !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <a href="index.html" class="brand"><div class="brand-icon"><i data-lucide="cpu" style="width: 20px; height: 20px;"></i></div><span>Masum Automation</span></a>
        <div class="user-badge">Public Workspace</div>
        
        <div class="nav-label">Navigation</div>
        <a href="index.html" class="nav-item"><i data-lucide="home" class="nav-icon"></i> Welcome</a>
        
        <div class="nav-label">Tool Suite</div>
        <a href="uid_extractor.html" class="nav-item active"><i data-lucide="scan-line" class="nav-icon" style="color: var(--icon-orange);"></i> UID Extractor</a>
        <a href="cookies_converter.html" class="nav-item"><i data-lucide="file-json-2" class="nav-icon" style="color: var(--icon-red);"></i> Cookies Converter</a>
        <a href="error_filter.html" class="nav-item"><i data-lucide="zap" class="nav-icon" style="color: var(--accent-green);"></i> Error Filter Pro</a>
        
        
        
        <div class="sidebar-bottom">
            <div class="control-box"><span>Live Active</span> <span style="color: var(--text-main); font-weight:bold;">1</span></div>
            <div class="control-box"><span>Theme</span> <span>Dark ▼</span></div>
        </div>
    </aside>

    <div class="main-wrapper">
        <div class="mobile-header">
            <button class="menu-btn" onclick="toggleSidebar()"><i data-lucide="menu" style="width: 24px; height: 24px;"></i></button>
            <span style="font-weight: 700; font-size: 1.1rem;">Masum Automation</span>
            <div style="width: 24px;"></div>
        </div>

        <main class="main-content">
            <div class="panel">
                <div class="top">
                    <h1 class="tool-title"><i data-lucide="scan-line" style="color: var(--icon-orange);"></i> UID Extractor</h1>
                    <span class="status-badge" id="status">Ready</span>
                </div>
                
                <textarea id="cookies" spellcheck="false" placeholder="Paste raw cookies here..."></textarea>
                
                <div class="actions">
                    <button class="primary" id="extract"><i data-lucide="play" style="width: 16px;"></i> Extract UID</button>
                    <button class="secondary" id="clear"><i data-lucide="trash-2" style="width: 16px;"></i> Clear</button>
                </div>
                
                <section class="output-wrap">
                    <div class="output-head">
                        <div class="output-title"><i data-lucide="list" style="width: 14px;"></i> Extracted UIDs <span class="count" id="count">0</span></div>
                        <button class="secondary copy" id="copy"><i data-lucide="copy" style="width: 12px;"></i> Copy All</button>
                    </div>
                    <div id="output" class="empty">UIDs will appear here</div>
                </section>
            </div>
        </main>

        <footer class="footer">
            <div>Masum Automation Suite</div>
            <div class="footer-links">
                <a href="https://t.me/MasumHub"><i data-lucide="send" style="width: 14px;"></i> Telegram</a>
                <a href="https://t.me/MasumHub"><i data-lucide="shield-question" style="width: 14px;"></i> Support</a>
                <span style="margin-left: 0;">© 2026 MasumHub. All rights reserved.</span>
            </div>
        </footer>
    </div>

    <script>
    lucide.createIcons();
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    }
    (() => {
        const input=document.getElementById('cookies');
        const output=document.getElementById('output');
        const count=document.getElementById('count');
        const status=document.getElementById('status');
        let uids=[];
        
        function extract(){
            const matches=[...input.value.matchAll(/(?:^|[;|,\s])c_user\s*=\s*["']?(\d+)/g)];
            uids=[...new Set(matches.map(m=>m[1]))];
            count.textContent=uids.length;
            output.textContent=uids.length?uids.join('\n'):'No UID found';
            output.classList.toggle('empty',!uids.length);
            status.textContent=uids.length?'Completed':'No results';
        }
        
        document.getElementById('extract').addEventListener('click',extract);
        document.getElementById('clear').addEventListener('click',()=>{
            input.value='';uids=[];count.textContent='0';
            output.textContent='UIDs will appear here';output.classList.add('empty');
            status.textContent='Ready';input.focus();
        });
        
        document.getElementById('copy').addEventListener('click',async()=>{
            if(!uids.length)return;
            try{
                await navigator.clipboard.writeText(uids.join('\n'));
                const b=document.getElementById('copy');b.innerHTML='<i data-lucide="check" style="width: 12px;"></i> Copied';
                lucide.createIcons();
                setTimeout(()=>{ b.innerHTML='<i data-lucide="copy" style="width: 12px;"></i> Copy All'; lucide.createIcons(); },1100);
            }catch{ status.textContent='Select to copy'; }
        });
    })();
    </script>
</body>
</html>
